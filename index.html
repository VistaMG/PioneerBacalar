<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Melipona Bacalar</title>
<meta name="description" content="Melipona Bacalar — a private preview.">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="images/logo-icon.png">
<!-- Loads the password hash. data-cover tells gate.js not to redirect this page. -->
<script src="gate.js" data-cover></script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --teal-deep:#054252;
  --green:#2d9f86;
  --green-light:#3dbfa0;
  --red-accent:#dd4a2a;
  --navy-deep:#0e1820;
  --cream:#f5f0e6;
  --white:#fff;
  --font-display:'Cormorant Garamond',Georgia,serif;
  --font-body:'Outfit',system-ui,sans-serif;
}
html,body{height:100%}
body{font-family:var(--font-body);color:var(--cream);background:var(--navy-deep);-webkit-font-smoothing:antialiased;overflow:hidden}

.cover{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4rem 1.5rem}
.cover-bg{position:absolute;inset:0;z-index:0;overflow:hidden}
.cover-bg img{width:100%;height:100%;object-fit:cover;animation:slowZoom 30s ease-in-out infinite alternate}
.cover-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,24,32,0.62) 0%,rgba(14,24,32,0.38) 45%,rgba(14,24,32,0.82) 100%)}
@keyframes slowZoom{from{transform:scale(1)}to{transform:scale(1.07)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}

.cover-content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;width:100%;max-width:420px}
.cover-mark{margin-bottom:2rem;animation:fadeUp 1s ease .2s both}
.cover-mark svg{width:120px;height:auto;filter:drop-shadow(0 6px 24px rgba(0,0,0,0.45))}
.cover-name{font-family:var(--font-display);font-size:2.4rem;font-weight:400;letter-spacing:.12em;line-height:1;animation:fadeUp 1s ease .4s both}
.cover-sub{font-size:.66rem;letter-spacing:.5em;text-transform:uppercase;color:var(--green-light);margin-top:.7rem;font-weight:500;animation:fadeUp 1s ease .5s both}
.cover-rule{width:44px;height:1px;background:linear-gradient(90deg,transparent,var(--green-light),transparent);margin:2.6rem auto 2.4rem;animation:fadeUp 1s ease .65s both}

.gate-form{width:100%;animation:fadeUp 1s ease .8s both}
.gate-field{position:relative;width:100%}
.gate-field input{width:100%;background:transparent;border:none;border-bottom:1px solid rgba(245,240,230,0.4);color:var(--cream);font-family:var(--font-body);font-size:1rem;letter-spacing:.24em;text-align:center;padding:.9rem 2.6rem .9rem 2.6rem;outline:none;font-weight:300;transition:border-color .3s}
.gate-field input::placeholder{color:rgba(245,240,230,0.45);letter-spacing:.32em;text-transform:uppercase;font-size:.7rem}
.gate-field input:focus{border-bottom-color:var(--green-light)}
.gate-field input:-webkit-autofill{-webkit-text-fill-color:var(--cream);-webkit-box-shadow:0 0 0 1000px transparent inset;transition:background-color 9999s}
.gate-eye{position:absolute;right:0;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:rgba(245,240,230,0.5);padding:.4rem;display:flex;transition:color .3s}
.gate-eye:hover{color:var(--green-light)}
.gate-eye svg{width:16px;height:16px}
.gate-btn{margin-top:1.8rem;display:inline-flex;align-items:center;justify-content:center;gap:.8rem;font-size:.74rem;font-weight:500;letter-spacing:.28em;text-transform:uppercase;color:var(--white);background:var(--green);padding:1.05rem 3rem;border:1px solid var(--green);cursor:pointer;font-family:var(--font-body);transition:all .35s;width:100%}
.gate-btn:hover{background:var(--green-light);border-color:var(--green-light);transform:translateY(-2px);box-shadow:0 12px 35px rgba(45,159,134,0.35)}
.gate-btn:disabled{opacity:.6;cursor:wait;transform:none;box-shadow:none}
.gate-btn svg{width:13px;height:13px;transition:transform .3s}
.gate-btn:hover svg{transform:translateX(4px)}
.gate-status{min-height:1.4rem;margin-top:1.2rem;font-size:.72rem;letter-spacing:.14em;color:var(--red-accent);opacity:0;transition:opacity .3s;font-weight:400}
.gate-status.show{opacity:1}

.shake{animation:shake .5s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

.cover-foot{position:absolute;bottom:1.8rem;left:0;right:0;z-index:2;text-align:center;font-size:.62rem;letter-spacing:.3em;text-transform:uppercase;color:rgba(245,240,230,0.45);font-weight:400;animation:fadeUp 1s ease 1.1s both;padding:0 1.5rem}

@media(max-width:480px){
  .cover-mark svg{width:96px}
  .cover-name{font-size:2rem}
  .cover-sub{font-size:.6rem;letter-spacing:.4em}
}
@media(prefers-reduced-motion:reduce){
  .cover-bg img{animation:none}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="melipona-icon" viewBox="-5 5 215 100">
      <g transform="translate(100 130)">
        <g transform="rotate(-66)"><path d="M -6 -98 L 0 -82 L 6 -98 L 0 -118 Z" fill="#054252"/></g>
        <g transform="rotate(-44)"><path d="M -6 -98 L 0 -82 L 6 -98 L 0 -118 Z" fill="#2d9f86"/></g>
        <g transform="rotate(-22)"><path d="M -6 -98 L 0 -82 L 6 -98 L 0 -118 Z" fill="#2d9f86"/></g>
        <g transform="rotate(0)"><path d="M -6 -98 L 0 -82 L 6 -98 L 0 -118 Z" fill="#dd4a2a"/></g>
        <g transform="rotate(22)"><path d="M -6 -98 L 0 -82 L 6 -98 L 0 -118 Z" fill="#2d9f86"/></g>
        <g transform="rotate(44)"><path d="M -6 -98 L 0 -82 L 6 -98 L 0 -118 Z" fill="#2d9f86"/></g>
        <g transform="rotate(66)"><path d="M -6 -98 L 0 -82 L 6 -98 L 0 -118 Z" fill="#054252"/></g>
      </g>
    </symbol>
  </defs>
</svg>

<main class="cover">
  <div class="cover-bg">
    <img src="images/hero.jpg" alt="">
  </div>

  <div class="cover-content">
    <div class="cover-mark">
      <svg viewBox="-5 5 215 100"><use href="#melipona-icon"/></svg>
    </div>
    <div class="cover-name">MELIPONA</div>
    <div class="cover-sub">Bacalar</div>
    <div class="cover-rule"></div>

    <form class="gate-form" id="gate-form" autocomplete="off" novalidate>
      <div class="gate-field">
        <input type="password" id="gate-password" name="password" placeholder="Password" aria-label="Password" autocomplete="current-password" autofocus>
        <button type="button" class="gate-eye" id="gate-eye" aria-label="Show password">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <button type="submit" class="gate-btn" id="gate-submit">
        <span>Enter</span>
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
      </button>
      <div class="gate-status" id="gate-status" role="alert"></div>
    </form>
  </div>

  <div class="cover-foot">Bacalar &nbsp;·&nbsp; Quintana Roo &nbsp;·&nbsp; México</div>
</main>

<script>
(function(){
  var params = new URLSearchParams(location.search);
  var HOME = 'home.html';

  /* Where to send the visitor after unlocking (only same-folder pages allowed) */
  var ret = params.get('return') || '';
  if(!/^[A-Za-z0-9_\-]+\.html(#[A-Za-z0-9_\-]*)?$/.test(ret) || ret.indexOf('index.html') === 0){ ret = HOME; }

  /* index.html?logout=1 locks this browser again */
  if(params.has('logout')){
    try { localStorage.removeItem(MB_GATE_KEY); } catch(e){}
    history.replaceState(null, '', location.pathname);
  } else {
    /* Already unlocked on this browser? Go straight in. */
    try {
      if(localStorage.getItem(MB_GATE_KEY) === MB_GATE_HASH){ location.replace(ret); return; }
    } catch(e){}
  }

  var form = document.getElementById('gate-form');
  var input = document.getElementById('gate-password');
  var btn = document.getElementById('gate-submit');
  var status = document.getElementById('gate-status');
  var eye = document.getElementById('gate-eye');

  eye.addEventListener('click', function(){
    var show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    eye.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    input.focus();
  });

  function sha256Hex(str){
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)).then(function(buf){
      return Array.from(new Uint8Array(buf)).map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
    });
  }

  function fail(msg){
    status.textContent = msg;
    status.classList.add('show');
    form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
    input.value = '';
    input.focus();
    btn.disabled = false;
  }

  var attempts = 0;
  form.addEventListener('submit', function(e){
    e.preventDefault();
    var value = input.value.trim();
    if(!value){ fail('Please enter the password.'); return; }
    if(!(window.crypto && crypto.subtle)){ fail('Your browser cannot verify the password. Please use a current browser over https.'); return; }
    btn.disabled = true;
    status.classList.remove('show');

    /* Small, growing delay after wrong guesses */
    var wait = Math.min(attempts * 600, 3000);
    setTimeout(function(){
      sha256Hex(MB_GATE_SALT + value).then(function(hex){
        if(hex === MB_GATE_HASH){
          try { localStorage.setItem(MB_GATE_KEY, MB_GATE_HASH); } catch(e){}
          location.replace(ret);
        } else {
          attempts++;
          fail('That password is not recognised.');
        }
      }).catch(function(){ fail('Something went wrong. Please try again.'); });
    }, wait);
  });
})();
</script>
</body>
</html>
